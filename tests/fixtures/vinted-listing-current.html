<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Sell an item · local Vinted form fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: #172126;
      background: #fff;
      font:
        14px Arial,
        sans-serif;
    }
    header {
      border-bottom: 1px solid #eceeef;
    }
    nav {
      max-width: 1120px;
      margin: auto;
      height: 64px;
      display: flex;
      gap: 28px;
      align-items: center;
      padding: 0 24px;
    }
    .brand {
      font:
        italic bold 30px Georgia,
        serif;
      color: #007782;
    }
    .search {
      flex: 1;
      background: #f0f3f3;
      color: #617075;
      border-radius: 4px;
      padding: 12px;
    }
    .nav-action {
      background: #007782;
      color: #fff;
      border: 0;
      border-radius: 4px;
      padding: 10px 16px;
    }
    .categories {
      max-width: 1120px;
      margin: auto;
      padding: 13px 24px;
      color: #5d6a70;
      word-spacing: 20px;
    }
    main {
      max-width: 560px;
      margin: 32px auto 80px;
      padding: 0;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 40px;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 20px;
      font-weight: 600;
    }
    .photos-heading {
      height: 40px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .photo-section {
      margin-bottom: 40px;
    }
    [data-testid="media-upload-grid"] {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid #e2e5e7;
      border-radius: 5px;
      min-height: 178px;
      padding: 20px;
    }
    [data-testid="add-photos-input"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .photo-box {
      position: relative;
      flex: none;
      width: 102px;
      height: 128px;
      border-radius: 4px;
      overflow: hidden;
    }
    .photo-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .native-photo-upload {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 102px;
      height: 128px;
      border: 1px dashed #bec7c9;
      border-radius: 4px;
      color: #007782;
      background: white;
      cursor: pointer;
    }
    .native-photo-upload svg {
      width: 24px;
      height: 24px;
    }
    label.field {
      display: block;
      margin: 0 0 20px;
    }
    label.field > span {
      display: block;
      margin-bottom: 8px;
      color: #5d6a70;
    }
    input:not([type="file"]),
    textarea,
    select {
      display: block;
      width: 100%;
      border: 1px solid #bac2c5;
      border-radius: 4px;
      padding: 12px;
      background: white;
      color: #172126;
      min-height: 44px;
      font:
        16px Arial,
        sans-serif;
    }
    textarea {
      resize: vertical;
      min-height: 126px;
    }
    input::placeholder,
    textarea::placeholder {
      color: #728087;
    }
    section.details {
      margin-top: 36px;
    }
    .native-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }
    .native-footer button {
      padding: 12px 20px;
      border: 1px solid #007782;
      border-radius: 4px;
      background: white;
      color: #007782;
      font: 14px Arial;
    }
    .native-footer button:last-child {
      background: #007782;
      color: white;
    }
    @media (max-width: 640px) {
      nav {
        height: 56px;
        padding: 0 16px;
        gap: 16px;
      }
      .search,
      .categories {
        display: none;
      }
      nav .nav-action {
        margin-left: auto;
      }
      main {
        margin: 24px 16px 48px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 28px;
      }
      .photo-section {
        margin-bottom: 28px;
      }
      [data-testid="media-upload-grid"] {
        padding: 16px;
        min-height: 156px;
        gap: 8px;
      }
      .photo-box,
      .native-photo-upload {
        width: 86px;
        height: 108px;
      }
    }
  </style>
  <style>
    .native-field {
      margin-bottom: 20px;
    }
    .native-field > label {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      color: #5d6a70;
    }
  </style>
  <body data-fixture="vinted-current">
    <header>
      <nav>
        <span class="brand">Vinted</span>
        <div class="search">Catalogue　 Search for items</div>
        <span>♡</span><button type="button" class="nav-action">Sell now</button>
      </nav>
      <div class="categories">
        Women Men Designer Kids Home Electronics Books Hobbies Sports
      </div>
    </header>
    <main>
      <h1>Sell an item</h1>
      <section class="photo-section">
        <h2 class="photos-heading">Photos</h2>
        <section data-testid="media-upload-grid">
          <input
            id="native-photo-input"
            data-testid="add-photos-input"
            name="photos"
            type="file"
            multiple
            accept="image/*"
          />
          <div class="photo-box">
            <div
              class="photo-box__image-container"
              data-testid="image-wrapper-1"
            >
              <img
                class="web_ui__Image__content"
                alt="Uploaded photo 1"
                src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII="
              />
            </div>
          </div>
          <label
            class="native-photo-upload"
            for="native-photo-input"
            aria-label="Upload photos"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M4 7h4l2-3h4l2 3h4v13H4z" />
              <circle cx="12" cy="13" r="4" /></svg
          ></label>
        </section>
      </section>
      <h2>About your item</h2>
      <div class="native-field" data-bloom="true">
        <label for="bloom-title">Title</label>
        <div class="input-root" data-testid="title">
          <input
            id="bloom-title"
            data-testid="title--input"
            placeholder="Tell buyers what you’re selling"
          />
        </div>
      </div>
      <div class="native-field" data-bloom="true">
        <label for="bloom-description">Description</label>
        <div class="input-root" data-testid="description">
          <textarea
            id="bloom-description"
            data-testid="description--input"
            placeholder="Tell buyers about your item"
          ></textarea>
        </div>
      </div>
      <section class="details">
        <h2>Item details</h2>
        <label class="field"
          ><span>Category</span
          ><select>
            <option>Select a category</option>
          </select></label
        ><label class="field"
          ><span>Brand</span><input placeholder="Enter the brand"
        /></label>
      </section>
      <section class="details">
        <h2>Pricing</h2>
        <label class="field"
          ><span>Price</span><input placeholder="€0.00"
        /></label>
      </section>
      <div class="native-footer">
        <button type="button">Save draft</button
        ><button type="button">Upload</button>
      </div>
    </main>
  </body>
</html>
