name: Auth restart diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [package-only]
        default: package-only
      bump_patch:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      AUTH_RESTART_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Three auth-group rounds with phase and browser traces
        run: xvfb-run -a npx playwright test tests/e2e/auth-action-correlation.spec.js --repeat-each=3 --workers=1 --reporter=line --trace=on
      - name: Preserve diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-restart-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: warn
